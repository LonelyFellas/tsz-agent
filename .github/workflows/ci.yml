name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      database:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: tsz_agent_test
          POSTGRES_USER: agent_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agent_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TSZ_AGENT_DATABASE_URL: postgresql+psycopg://agent_test@127.0.0.1:5432/tsz_agent_test
      TEST_DATABASE_URL: postgresql+psycopg://agent_test@127.0.0.1:5432/tsz_agent_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
      - run: uv sync --locked
      - run: uv run ruff check && uv run ruff format --check && uv run mypy
      - run: uv run alembic upgrade head && uv run alembic check
      - run: uv run pytest -q
      - run: uv run python -m tsz_agent.export_openapi --check
      - run: uv build
